<head>

  <meta charset="UTF-8" />

  <title>404 Not Found — Futures Prop Compare</title>
  <meta name="description" content="The page you're looking for might have been moved or doesn't exist." />
  <meta name="robots" content="noindex, follow" />

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="main-logo.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0515;
      --white:    #f0eaff;
      --muted:    #7c6b9e;
      --accent:   #a78bfa;
      --border:   rgba(160,100,255,0.12);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 10% 5%,  rgba(124,58,237,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 80%, rgba(167,139,250,0.10) 0%, transparent 55%),
        radial-gradient(ellipse 50% 35% at 50% 50%, rgba(76,110,245,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── EMPTY STATE (from Shadcn) ─── */
    .empty-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 48px;
      text-align: center;
      border: 2px dashed var(--border);
      border-radius: 20px;
      background: rgba(18,10,36,0.3);
      backdrop-filter: blur(10px);
      max-width: 500px;
      width: 90%;
    }

    .empty-title {
      font-size: 8rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #f0eaff 30%, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0;
      letter-spacing: -0.05em;
    }

    .empty-description {
      font-size: 1.1rem;
      color: var(--muted);
      line-height: 1.6;
      margin-top: -10px;
    }

    .empty-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ─── BUTTONS ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      transition: all .2s;
      gap: 8px;
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff;
      box-shadow: 0 4px 20px rgba(124,58,237,0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(124,58,237,0.5);
    }

    .btn-outline {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      color: var(--white);
    }

    .btn-outline:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(167,139,250,0.3);
    }
  </style>
</head>
<body>

  <div class="empty-wrapper">
    
    <div class="empty-title">404</div>
    
    <p class="empty-description">
      The page you're looking for might have been<br />
      moved or doesn't exist.
    </p>

    <div class="empty-actions">
      <a href="index.html" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-home"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Go Home
      </a>
      
      <a href="blog.html" class="btn btn-outline">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-compass"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        Explore
      </a>
    </div>
    
  </div>

</body>
</html>
