<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e0e45"/>
      <stop offset="100%" stop-color="#07030f"/>
    </radialGradient>
    <linearGradient id="arr" x1="5" y1="29" x2="31" y2="7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="36" height="36" rx="9" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="0.6" y="0.6" width="34.8" height="34.8" rx="8.5" fill="none" stroke="#9d5cf6" stroke-width="1.2" opacity="0.7"/>
  <!-- Candlestick 1 -->
  <line x1="9" y1="21" x2="9" y2="27" stroke="rgba(200,160,255,0.5)" stroke-width="0.8"/>
  <rect x="7" y="22" width="4" height="4" rx="0.8" fill="rgba(180,140,255,0.65)"/>
  <!-- Candlestick 2 -->
  <line x1="16" y1="12" x2="16" y2="27" stroke="rgba(220,190,255,0.6)" stroke-width="0.8"/>
  <rect x="14" y="14" width="4" height="10" rx="0.8" fill="rgba(235,210,255,0.85)"/>
  <!-- Candlestick 3 -->
  <line x1="23" y1="16" x2="23" y2="27" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
  <rect x="21" y="18" width="4" height="8" rx="0.8" fill="rgba(255,255,255,0.92)"/>
  <!-- Arrow -->
  <polyline points="5,29 11,23 17,26 28,11" stroke="url(#arr)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polyline points="23,9 28,11 26,16" stroke="url(#arr)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
